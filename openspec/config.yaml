schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

context: |
  Releases are fully automated: semantic-release (.releaserc.json), run by the
  `release` job in .github/workflows/build.yml, versions, changelogs, tags and
  publishes a GitHub Release from Conventional Commits on every push to main
  that touches source/StopWatch/** and passes tests. Never hand-edit
  CHANGELOG.md or the version attributes in AssemblyInfo.cs.

  Before starting a new change (`openspec new change ...`), check the current
  branch first. If it isn't main, ask the user whether to stay on that branch
  or switch to main. Either way, pull the resulting branch before starting
  any work. If the resulting branch is main, create a new branch from it and
  switch to it before scaffolding the change — a new change must never be
  scaffolded directly on main.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
