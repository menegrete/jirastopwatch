---

name: "Build"
run-name: "Build"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: "Build"
    runs-on: windows-latest
    # Debug failures never block anything downstream; Release failures must
    # fail this job so the release job's `needs: [build]` actually gates on
    # tests passing, instead of continue-on-error masking a red Release run.
    continue-on-error: ${{ matrix.configuration == 'Debug' }}

    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Debug
          - Release
        dotnet-version:
          - 10.0.x

    env:
      CONFIGURATION: '${{ matrix.configuration }}'
      SOLUTION_NAME: 'StopWatch.sln'
      SETTINGS_FILE: '.runsettings'
      TEST_LOGGER: 'trx;logfilename=testResults.trx'

    steps:
      - id: checkout
        name: "Checkout"
        uses: actions/checkout@v7

      - id: setup-dotnet
        name: "Setup Dotnet"
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - id: dotnet-restore
        name: "Dotnet Restore"
        run: dotnet restore "$env:SOLUTION_NAME"

      - id: build
        name: "Build"
        run: dotnet build --configuration "$env:CONFIGURATION" --no-restore "$env:SOLUTION_NAME"

      - id: test
        name: "Test"
        run: dotnet test --configuration "$env:CONFIGURATION" --no-restore --no-build --settings "$env:SETTINGS_FILE" --logger "$env:TEST_LOGGER" --logger "console;verbosity=detailed" "$env:SOLUTION_NAME"

      - id: upload-test-artifact
        if: always() && !contains(fromJSON('["cancelled", "skipped"]'), steps.test.outcome)
        name: "Archive Test Results"
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ join(matrix.*, '-') }}
          path: '**/*.trx'
          if-no-files-found: error

  debug-needs-result:
    name: "DEBUG: print needs.build.result (throwaway, do not merge)"
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: echo "needs.build.result = ${{ needs.build.result }}"

  publish-test-results:
    if: always() && !contains(fromJSON('["cancelled", "skipped"]'), needs.build.result)
    name: "Publish Tests Results"
    needs: build
    runs-on: ubuntu-latest

    permissions:
      checks: write
      pull-requests: write
      contents: read
      issues: read

    steps:
      - id: download-test-artifact
        name: "Download Test Results"
        uses: actions/download-artifact@v8
        with:
          pattern: 'test-results-*'
          path: 'test-results'

      - id: publish-test-results
        name: "Publish Test Results"
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          action_fail: true
          time_unit: milliseconds
          files: "test-results/**/*.trx"

  release:
    name: "Release"
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - id: checkout
        name: "Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: changed-files
        name: "Check for App Source Changes"
        uses: dorny/paths-filter@v3
        with:
          filters: |
            app:
              - 'source/StopWatch/**'

      - if: steps.changed-files.outputs.app == 'true'
        id: setup-dotnet
        name: "Setup Dotnet"
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - if: steps.changed-files.outputs.app == 'true'
        id: setup-node
        name: "Setup Node"
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - if: steps.changed-files.outputs.app == 'true'
        id: npm-install
        name: "Install Release Tooling"
        run: npm ci

      - if: steps.changed-files.outputs.app == 'true'
        id: semantic-release
        name: "Release"
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
