name: "Publish plugin abstractions"
run-name: "Publish plugin abstractions"

# Publishes StopWatch.Plugin.Abstractions to GitHub Packages so plugin
# repositories can reference it. Its version is the contract version
# (<Version> in the csproj, kept in step with PluginContract.ContractVersion),
# not the application's: it is published only when the contract assembly
# changes, and a version that already exists is skipped rather than failing.

on:
  push:
    branches: [main]
    paths:
      - 'source/StopWatch.Plugin.Abstractions/**'

permissions:
  contents: read
  packages: write

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  publish:
    name: "Pack and push"
    runs-on: windows-latest

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Setup Dotnet"
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: "Pack"
        run: dotnet pack source/StopWatch.Plugin.Abstractions/StopWatch.Plugin.Abstractions.csproj --configuration Release --output artifacts

      - name: "Push to GitHub Packages"
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate
